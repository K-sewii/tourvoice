name: .NET CI cho Web API 3 Lop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore ./server/TourVoice.API/TourVoice.API.csproj
      
    - name: Build Project
      run: dotnet build ./server/TourVoice.API/TourVoice.API.csproj --no-restore --configuration Release
