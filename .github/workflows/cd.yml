name: CD

# Tu dong khi CI xanh tren main. Rollback: Run workflow, nhap image_tag la ma commit on dinh truoc do.
# Neu chua cau hinh secret may chu (DEPLOY_HOST...), buoc deploy tu bo qua va pipeline van xanh.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag image da co tren GHCR de trien khai lai (rollback). De trong = build tu commit hien tai."
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: image
    # Chi chay khi CI thanh cong (workflow_run) hoac khi chay tay.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      # GHCR bat buoc ten image chu thuong, con github.repository_owner giu nguyen chu hoa
      # (vd. K-sewii). Chuan hoa mot lan, dung lai cho moi tag va cho buoc deploy.
      namespace: ${{ steps.vars.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Chuan hoa namespace GHCR (chu thuong)
        id: vars
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Chon tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Dang nhap GHCR
        if: steps.tag.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build va push image API
        if: steps.tag.outputs.rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/tourvoice-api:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/tourvoice-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build va push image Web
        if: steps.tag.outputs.rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          # Rong = web goi API qua nginx cung origin (xem client/nginx.conf).
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/tourvoice-web:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/tourvoice-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: deploy
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Khong co may chu (repo demo) thi bo qua deploy thay vi fail ca pipeline.
      - name: Kiem tra cau hinh deploy
        id: cfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH HEALTH_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Chua cau hinh secret:$missing -> bo qua buoc deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Chep compose len may chu
        if: steps.cfg.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Pull image va khoi dong lai
        if: steps.cfg.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE: ${{ env.REGISTRY }}/${{ needs.image.outputs.namespace }}/tourvoice-api
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ needs.image.outputs.namespace }}/tourvoice-web
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,API_IMAGE,WEB_IMAGE
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Kiem tra /health
        if: steps.cfg.outputs.enabled == 'true'
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            echo "lan $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "API khong len sau 2 phut. Rollback: chay lai workflow nay voi image_tag la ban on dinh truoc do." >&2
          exit 1
