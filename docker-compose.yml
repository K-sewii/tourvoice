# API + MySQL 8.4 + web (PRD: "API va MySQL chay bang docker compose tren mot may chu Docker").
# Sao chep .env.example thanh .env va dien gia tri truoc khi chay: docker compose up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tourvoice
      MYSQL_USER: tv
      MYSQL_PASSWORD: ${DB_PASSWORD:?Can DB_PASSWORD trong .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Can DB_ROOT_PASSWORD trong .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3306:3306"   # chi de dev ket noi; production khong mo cong nay ra Internet
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # tu migrate + seed khi khoi dong
      ConnectionStrings__TourVoice: "Server=db;Port=3306;Database=tourvoice;User=tv;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?Can JWT_KEY (>= 32 ky tu) trong .env}
      Jwt__Issuer: ${JWT_ISSUER:-TourVoice}
      Jwt__Audience: ${JWT_AUDIENCE:-TourVoiceClient}
      MyMemory__Email: ${MYMEMORY_EMAIL}
      Cors__Origins__0: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "5049:8080"
    restart: on-failure

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5049}
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mysql-data:
